<svg xmlns="http://www.w3.org/2000/svg" width="880" height="368" viewBox="0 0 880 368" role="img" aria-labelledby="t d">
  <title id="t">Source map attribution against source-map-explorer</title>
  <desc id="d">Two log-log panels. Left, wall clock in seconds. Right, peak memory in megabytes. Against the number of sources in the map. The tinted band between the two lines is labelled with the multiple at each point. At 50,000 sources source-map-explorer costs 2,690 times the time and 9.58 times the memory: 562 s against 209 ms, and 642 MB against 67 MB.</desc>

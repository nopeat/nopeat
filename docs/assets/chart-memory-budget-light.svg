<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-labelledby="t d">
  <title id="t">Peak memory against the published budget</title>
  <desc id="d">Log-log scatter of peak memory against input size. B3 reads 127 MB against a 200 MB ceiling, B4 376 MB against 400 MB, B8 137 MB against 500 MB. The three markers are not joined, because they are not a line.</desc>
  <rect width="880" height="320" fill="#ffffff"/>
  <text x="0.00" y="28.00" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="start">Peak memory stays inside the published budget</text>
  <text x="0.00" y="47.00" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">B3 and B4 are one workload at two input sizes; B8 is the 1 GB input with a 36.5 MB source map added.</text>
  <text x="0.00" y="63.00" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">Each marker is a measurement; the dashed line above it is that target's published ceiling, not a reading.</text>
  <line x1="78.00" y1="221.75" x2="846.00" y2="221.75" stroke="#e5e7eb" stroke-width="1.0"/>
  <text x="68.00" y="225.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="end">100 MB</text>
  <line x1="78.00" y1="178.50" x2="846.00" y2="178.50" stroke="#e5e7eb" stroke-width="1.0"/>
  <text x="68.00" y="182.50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="end">200 MB</text>
  <line x1="78.00" y1="135.25" x2="846.00" y2="135.25" stroke="#e5e7eb" stroke-width="1.0"/>
  <text x="68.00" y="139.25" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="end">400 MB</text>
  <line x1="78.00" y1="92.00" x2="846.00" y2="92.00" stroke="#e5e7eb" stroke-width="1.0"/>
  <text x="68.00" y="96.00" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="end">800 MB</text>
  <line x1="219.22" y1="92.00" x2="219.22" y2="244.00" stroke="#e5e7eb" stroke-width="1.0" stroke-dasharray="2 3"/>
  <text x="219.22" y="262.00" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="middle">363 MB</text>
  <line x1="621.06" y1="92.00" x2="621.06" y2="244.00" stroke="#e5e7eb" stroke-width="1.0" stroke-dasharray="2 3"/>
  <text x="621.06" y="262.00" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="middle">1 GB</text>
  <line x1="78.00" y1="244.00" x2="846.00" y2="244.00" stroke="#d1d5db" stroke-width="1.0"/>
  <text x="462.00" y="278.00" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle">input size</text>
  <line x1="219.22" y1="206.93" x2="219.22" y2="178.50" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="228.22" y="172.50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start" stroke="#ffffff" stroke-width="3" paint-order="stroke">200 MB</text>
  <circle cx="219.22" cy="206.93" r="5.50" fill="#1d4ed8"/>
  <text x="231.22" y="210.93" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="600" fill="#111827" text-anchor="start">B3 · 127 MB</text>
  <line x1="610.06" y1="139.13" x2="610.06" y2="135.25" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="619.06" y="129.25" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start" stroke="#ffffff" stroke-width="3" paint-order="stroke">400 MB</text>
  <circle cx="610.06" cy="139.13" r="5.50" fill="#1d4ed8"/>
  <text x="598.06" y="143.13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="600" fill="#111827" text-anchor="end">B4 · 376 MB</text>
  <line x1="632.06" y1="202.10" x2="632.06" y2="121.33" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="641.06" y="115.33" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start" stroke="#ffffff" stroke-width="3" paint-order="stroke">500 MB</text>
  <circle cx="632.06" cy="202.10" r="5.50" fill="#1d4ed8"/>
  <text x="644.06" y="206.10" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="11" font-weight="600" fill="#111827" text-anchor="start">B8 · 137 MB</text>
  <text x="0.00" y="306.00" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">median of 3 runs, sampled every 25 ms · the working set moves about 15% between runs · B4 and B8 share the 1 GB input</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Nopeat">
  <!-- One mark, sized to stay legible at 32 px: four blocks whose areas are the
       same ratio as the memory numbers the tool reports, arranged like the
       treemap it draws. currentColor so the README and the report shell can
       recolour it, and so a dark-mode page gets the inverted version. -->
  <g fill="currentColor">
    <rect x="4" y="4" width="34" height="34" rx="5"/>
    <rect x="42" y="4" width="18" height="52" rx="5"/>
    <rect x="4" y="42" width="18" height="14" rx="5"/>
    <rect x="26" y="42" width="30" height="14" rx="5"/>
  </g>
</svg>

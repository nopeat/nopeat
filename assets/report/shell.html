<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>/*TITLE*/</title>
    <style>/*CSS*/</style>
  </head>
  <body>
    <header class="bar">
      <div class="bar__id">
        <svg class="mark" aria-hidden="true" viewBox="0 0 64 64" width="12" height="12"><g fill="currentColor"><rect x="4" y="4" width="34" height="34" rx="5"/><rect x="42" y="4" width="18" height="52" rx="5"/><rect x="4" y="42" width="18" height="14" rx="5"/><rect x="26" y="42" width="30" height="14" rx="5"/></g></svg>
        <span class="mark__text">Nopeat</span>
        <span class="sep" aria-hidden="true">/</span>
        <span class="target" id="target">—</span>
      </div>

      <div class="bar__stats" id="summary" role="group" aria-label="Summary"></div>

      <div class="bar__actions">
        <div class="seg" role="radiogroup" aria-label="Size dimension" id="dimension">
          <button type="button" role="radio" data-dim="stat" aria-checked="false">stat</button>
          <button type="button" role="radio" data-dim="parsed" aria-checked="true">parsed</button>
          <button type="button" role="radio" data-dim="gzip" aria-checked="false">gzip</button>
          <button type="button" role="radio" data-dim="attributed" aria-checked="false" disabled title="Needs source maps">attributed</button>
        </div>
        <button type="button" class="icon" id="theme" aria-label="Switch colour theme" title="Switch colour theme">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <circle cx="8" cy="8" r="3.25" fill="none" stroke="currentColor" stroke-width="1.25" />
            <path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1m11.95-4.95-1.13 1.13M4.18 11.82 3.05 12.95m9.9 0-1.13-1.13M4.18 4.18 3.05 3.05" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </header>

    <div class="frame">
      <aside class="side" aria-label="Filters">
        <div class="side__search">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" class="side__searchIcon">
            <circle cx="7" cy="7" r="4.25" fill="none" stroke="currentColor" stroke-width="1.3" />
            <path d="m10.2 10.2 3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          </svg>
          <input id="search" type="search" placeholder="filter packages, modules, files" autocomplete="off" spellcheck="false" />
          <button type="button" id="clear" class="side__clear" hidden aria-label="Clear filter">esc</button>
        </div>

        <nav class="dims" aria-label="Group by">
          <button type="button" class="dims__item is-active" data-dim="package"><span>package</span><em id="cnt-package"></em></button>
          <button type="button" class="dims__item" data-dim="source_file"><span>source file</span><em id="cnt-source"></em></button>
          <button type="button" class="dims__item" data-dim="chunk"><span>chunk</span><em id="cnt-chunk"></em></button>
          <button type="button" class="dims__item" data-dim="extension"><span>extension</span><em id="cnt-extension"></em></button>
        </nav>

        <div class="side__list" id="results" role="listbox" aria-label="Matches"></div>

        <div class="side__foot" id="diag" role="status"></div>
      </aside>

      <main class="stage">
        <div class="crumbs" id="crumbs" aria-label="Zoom path"></div>
        <div class="canvasWrap">
          <canvas id="map" role="img" aria-label="Treemap of bundle composition"></canvas>
          <div class="empty" id="empty" hidden>
            <p class="empty__title">Nothing to draw</p>
            <p class="empty__body">The graph has no assets with a non-zero size. Check that the
              input is a webpack <code>stats.json</code>, an esbuild <code>metafile.json</code>, or a
              dist folder whose assets are present on disk.</p>
          </div>
        </div>
        <div class="tip" id="tip" hidden aria-hidden="true"></div>
      </main>

      <aside class="inspect" id="inspect" aria-label="Selection details">
        <div class="inspect__empty" id="inspectEmpty">
          <p>Select a block to see what it is, how big it is in each dimension, and what pulled it in.</p>
        </div>
        <div class="inspect__body" id="inspectBody" hidden></div>
      </aside>
    </div>

    <script id="payload" type="application/json">/*PAYLOAD*/</script>
    <!--DETAIL-->
    <script>/*JS*/</script>
  </body>
</html>

# One label per area of the codebase, so an issue or PR routes to whoever owns
# it without anyone assigning it by hand.
"area: stats":
  - changed-files: {globs: ["crates/nopeat-core/src/stats/**"]}
"area: sizes":
  - changed-files: {globs: ["crates/nopeat-core/src/sizes/**"]}
"area: sourcemap":
  - changed-files: {globs: ["crates/nopeat-core/src/sourcemap/**"]}
"area: fusion":
  - changed-files: {globs: ["crates/nopeat-core/src/fusion/**"]}
"area: report":
  - changed-files: {globs: ["crates/nopeat-core/src/report/**", "assets/report/**"]}
"area: model":
  - changed-files: {globs: ["crates/nopeat-core/src/model.rs", "docs/contracts/**"]}
"area: cli":
  - changed-files: {globs: ["crates/nopeat-cli/**"]}
"area: wasm":
  - changed-files: {globs: ["crates/nopeat-wasm/**"]}
"area: bench":
  - changed-files: {globs: ["bench/**"]}
"area: ci":
  - changed-files: {globs: [".github/**"]}
"area: npm":
  - changed-files: {globs: ["npm/**"]}
"area: docs":
  - changed-files: {globs: ["docs/**", "*.md"]}
"area: npm-packaging":
  - changed-files: {globs: ["npm/nopeat/package.json", "npm/nopeat/install.mjs"]}
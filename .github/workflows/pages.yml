name: pages

# Builds the documentation book and publishes it to GitHub Pages. Separate from
# `ci.yml` on purpose: publishing needs `pages: write` and an OIDC token, and a
# workflow that also runs on pull requests must not hold either. The book is
# still built on every PR - that job is `docs` in `ci.yml` - so a broken
# SUMMARY is caught before this one runs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploying twice at once interleaves the two uploads and leaves the site
# half-old. Queue instead of cancelling: an in-flight deploy must finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install mdBook
        run: |
          set -euo pipefail
          # The same pin as the `docs` job in ci.yml. Bump both together.
          v=0.5.4
          curl -fsSL --retry 3 -o mdbook.tar.gz \
            "https://github.com/rust-lang/mdBook/releases/download/v$v/mdbook-v$v-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf mdbook.tar.gz
          sudo install -m 755 mdbook /usr/local/bin/mdbook
          mdbook --version
      - name: the book builds
        run: mdbook build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # `github-pages` is the environment GitHub creates for Pages. It has to be
    # named here or the deploy has nowhere to go.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
